<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Экологическая головоломка</title>
  <style>
    * {
      margin: 0;
      padding: 0;
    }

    html,
    body {
      height: 100%;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    canvas {
      display: block;
      max-width: 100%;
      max-height: 100%;
      border: 1px solid lightgray;
      touch-action: none;
    }

    /* body {
      min-height: 100vh;
      display: flex;

      align-items: center;

      background: white;
      color: #e8eaed;
    }

    canvas {

    }
 */
  </style>
</head>

<body>
  <!-- <canvas id="game" width="1920" height="1080"></canvas> -->
  <canvas id="game" width="3840" height="2160"></canvas>
  <!--  
  1080p (Full HD): 1920 x 1080
  4K 3840 × 2160   -->

  <script>
    function loadImage(url) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        //img.crossOrigin = 'anonymous'; // если нужно
        img.onload = () => resolve(img);
        img.onerror = () => reject(new Error(`Не удалось загрузить: ${url}`));
        img.src = url;
      });
    }

    async function loadImages(sources) {
      return Promise.all(sources.map(url => loadImage(url)));
    }

    // Проверяет, пересекаются ли два прямоугольника
    function rectsIntersect(a, b) {
      return !(
        a.x + a.w < b.x ||   // a левее b
        a.x > b.x + b.w ||   // a правее b
        a.y + a.h < b.y ||   // a выше b
        a.y > b.y + b.h      // a ниже b
      );
    }

  </script>

  <script type="module">
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");

    const indent = canvas.height * 0.01; // отступ от края
    const side = (0.30 * canvas.height); // основание треугольника

    // место сборки (ловушки)
    const desk = {
      x: canvas.width / 2 - 1.5 * side,
      y: canvas.height / 2 - side + 0.15 * side,
      w: 3 * side, h: 2 * side
    };

    // разбросанные карточки
    const mixer = {
      x: indent,
      y: indent,
      w: canvas.width - 2 * indent,
      h: canvas.height - 2 * indent
    };
    // запретная зона для разброса
    const nomixer = {
      x: desk.x,
      y: desk.y,
      w: desk.w,
      h: canvas.height
    };

    // графика
    const imageSources = [
      'img/ok0.jpg',
      'img/ok1.jpg',
      'img/ok2.jpg',
      'img/ok3.jpg',
      'img/ok4.jpg',
      'img/ok5.jpg',
    ];
    const images = await loadImages(imageSources);


    class Item {
      x; y; w; h;
      num = 1;
      type = 't';
      image;

      MakePath() {
        ctx.beginPath();

        if (this.type == 't') {
          // верхний треугольник
          ctx.moveTo(this.x, this.y); // левая верхняя вершина
          ctx.lineTo(this.x + this.w / 2, this.y + this.h); // нижняя вершина
          ctx.lineTo(this.x + this.w, this.y); // правая верхняя вершина
        } else if (this.type == 'b') {
          // нижний треугольник
          ctx.moveTo(this.x + this.w / 2, this.y); // верхняя вершина
          ctx.lineTo(this.x + this.w, this.y + this.h); // правая нижняя вершина
          ctx.lineTo(this.x, this.y + this.h); // левая нижняя вершина
        } else if (this.type == 'l') {
          // левый треугольник
          ctx.moveTo(this.x, this.y); // левая верхняя вершина
          ctx.lineTo(this.x + this.w, this.y + this.h / 2); // правая вершина
          ctx.lineTo(this.x, this.y + this.h); // левая нижняя вершина
        } else {
          // правый треугольник
          ctx.moveTo(this.x, this.y + this.h / 2); // левая вершина
          ctx.lineTo(this.x + this.w, this.y); // верхняя правая вершина
          ctx.lineTo(this.x + this.w, this.y + this.h); // нижняя правая вершина
        }

        ctx.closePath();
        ctx.clip(); // применяем клип
      }

      constructor(num, type) {
        this.num = num;
        this.type = type;
        this.image = images[num];
        if (this.type == 't') {
          this.w = side;
          this.h = side / 2;
        } else if (this.type == 'b') {
          this.w = side;
          this.h = side / 2;
        } else if (this.type == 'l') {
          this.w = side / 2;
          this.h = side;
        } else {
          this.w = side / 2;
          this.h = side;
        }
      }
    }

    // треугольники (фигуры)
    const items = [
      new Item(0, 't'),
      new Item(0, 'b'),
      new Item(0, 'l'),
      new Item(0, 'r'),

      new Item(1, 't'),
      new Item(1, 'b'),
      new Item(1, 'l'),
      new Item(1, 'r'),

      new Item(2, 't'),
      new Item(2, 'b'),
      new Item(2, 'l'),
      new Item(2, 'r'),

      new Item(3, 't'),
      new Item(3, 'b'),
      new Item(3, 'l'),
      new Item(3, 'r'),

      new Item(4, 't'),
      new Item(4, 'b'),
      new Item(4, 'l'),
      new Item(4, 'r'),

      new Item(5, 't'),
      new Item(5, 'b'),
      new Item(5, 'l'),
      new Item(5, 'r'),
    ];


    // перемешать карточки на столе
    function mixItems() {
      for (let item of items) {
        while (true) {
          item.x = mixer.x + Math.random() * (mixer.w - item.w);
          item.y = mixer.y + Math.random() * (mixer.h - item.h);

          if (!rectsIntersect(item, nomixer)) // не попал в запретную зону
            break;
        }
      }
    }
    mixItems();


    class Trap {
      x; y; w; h;

      constructor(x, y) {
        this.x = x;
        this.y = y;
        this.w = side;
        this.h = side;
      }
    }

    const traps = [
      new Trap(desk.x + 0 * side, desk.y),
      new Trap(desk.x + 1 * side, desk.y),
      new Trap(desk.x + 2 * side, desk.y),

      new Trap(desk.x + 0 * side, desk.y + side),
      new Trap(desk.x + 1 * side, desk.y + side),
      new Trap(desk.x + 2 * side, desk.y + side),
    ];


    const info = {
      e: null,
    }

    const drag = {
      active: false,
      item: null,
      offsetX: 0,
      offsetY: 0
    };


    function canvasPoint(e) {
      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;
      return {
        x: (e.clientX - rect.left) * scaleX,
        y: (e.clientY - rect.top) * scaleY
      };
    }


    function hitsItem(x, y) {
      // поиск попадания курсором. перебор массива в обратном порядке
      for (let i = items.length - 1; i >= 0; i--) {
        let item = items[i];
        ctx.save(); //  Сохраняем состояние
        item.MakePath();
        const isInside = ctx.isPointInPath(x, y);
        ctx.restore(); // Восстанавливаем состояние
        if (isInside)
          return item;
      }
      return null;
    }


    function clamp() {
      const item = drag.item;
      if (item == null)
        return;
      item.x = Math.max(0, Math.min(canvas.width - item.w, item.x));
      item.y = Math.max(0, Math.min(canvas.height - item.h, item.y));
    }

    function calcTrap() {
      const item = drag.item;
      if (item == null)
        return;

      const distance = 0.1 * side;

      for (let trap of traps) {
        // точка привязки
        let point = { x: 0, y: 0 };

        if (item.type == 't' || item.type == 'l') {
          point = { x: trap.x, y: trap.y };
        }
        else if (item.type == 'b') {
          point = { x: trap.x, y: trap.y + trap.h / 2 };
        }
        else {
          point = { x: trap.x + trap.w / 2, y: trap.y };
        }

        if (Math.abs(point.x - item.x) < distance && Math.abs(point.y - item.y) < distance) {
          item.x = point.x;
          item.y = point.y;
          return;
        }
      }
    }

    canvas.addEventListener("pointerdown", (e) => {
      const p = canvasPoint(e);

      let item = hitsItem(p.x, p.y);
      if (item != null) {
        // перенос в конец массива (в ближний слой)
        const index = items.indexOf(item);
        if (index == -1)
          return;
        items.splice(index, 1);
        items.push(item);

        drag.active = true;
        drag.item = item;
        drag.offsetX = p.x - item.x;
        drag.offsetY = p.y - item.y;
        canvas.setPointerCapture(e.pointerId); // захват курсора
        canvas.style.cursor = "grabbing";
      }
    });

    canvas.addEventListener("pointermove", (e) => {
      info.e = e; // debug

      const p = canvasPoint(e);

      if (drag.active) {
        drag.item.x = p.x - drag.offsetX;
        drag.item.y = p.y - drag.offsetY;
        clamp();
        calcTrap();
        return;
      }
      let item = hitsItem(p.x, p.y);
      canvas.style.cursor = item != null ? "grab" : "default";
    });

    function endDrag(e) {
      drag.active = false;
      canvas.style.cursor = "default";

      // Отпускаем захват ?
      canvas.releasePointerCapture(e.pointerId);
    }

    canvas.addEventListener("pointerup", (e) => {
      // console.log("pointerup");
      endDrag(e);
    });

    canvas.addEventListener("pointercancel", (e) => {
      // console.log("pointercancel");
      endDrag(e);
    });

    // canvas.addEventListener("pointerleave", (e) => {
    //   // console.log("pointerleave");
    // });

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      //рисуем ловушки (фон + пунктир)
      for (let trap of traps) {
        ctx.fillStyle = "lightgray";
        ctx.fillRect(trap.x, trap.y, trap.w, trap.h);

        ctx.setLineDash([10, 5]); // Задаём пунктир: 10px линия, 5px пробел
        ctx.strokeStyle = 'gray'; //'#000';
        ctx.lineWidth = 2;

        ctx.beginPath();
        ctx.moveTo(trap.x, trap.y);
        ctx.lineTo(trap.x + trap.w, trap.y + trap.w);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(trap.x + trap.w, trap.y);
        ctx.lineTo(trap.x, trap.y + trap.w);
        ctx.stroke();
      }

      ctx.beginPath();
      ctx.moveTo(desk.x + 1 * side, desk.y);
      ctx.lineTo(desk.x + 1 * side, desk.y + 2 * side);

      ctx.moveTo(desk.x + 2 * side, desk.y);
      ctx.lineTo(desk.x + 2 * side, desk.y + 2 * side);

      ctx.moveTo(desk.x, desk.y + side);
      ctx.lineTo(desk.x + 3 * side, desk.y + side);

      ctx.stroke();

      // рисуем фигуры. перебор массива в прямом порядке
      for (let item of items) {
        ctx.save(); // Сохраняем состояние
        item.MakePath();

        if (item.type == 't') {
          // верхний треугольник
          ctx.drawImage(item.image,
            0, 0, 800, 400,
            item.x, item.y, item.w, item.h);
        } else if (item.type == 'b') {
          // нижний треугольник
          ctx.drawImage(item.image,
            0, 400, 800, 400,
            item.x, item.y, item.w, item.h);
        } else if (item.type == 'l') {
          // левый треугольник
          ctx.drawImage(item.image,
            0, 0, 400, 800,
            item.x, item.y, item.w, item.h);
        } else {
          // правый треугольник
          ctx.drawImage(item.image,
            400, 0, 400, 800,
            item.x, item.y, item.w, item.h);
        }

        ctx.restore(); // Восстанавливаем состояние
      }
    }

    function drawInfo() {
      ctx.fillStyle = "black";
      ctx.font = "52px courier new bold";
      let y = 10;
      let dy = 60

      // canvas:
      const rect = canvas.getBoundingClientRect();
      ctx.fillText(`canvas bounding rect= ${rect.x} ${rect.y} ${rect.width} ${rect.height}`, 5, y += dy);
      ctx.fillText(`canvas= ${canvas.x} ${canvas.y} ${canvas.width} ${canvas.height}`, 5, y += dy);

      // geometry:
      ctx.fillText(`indent= ${indent} side=${side}`, 5, y += dy);
      ctx.fillText(`desk= ${desk.x} w:${desk.w}`, 5, y += dy);
      ctx.fillText(`mixer= ${mixer.x} ${mixer.y} ${mixer.w} ${mixer.h}`, 5, y += dy);

      // mouse:
      if (info.e != null) {
        ctx.fillText(`e.client= ${info.e.clientX} ${info.e.clientY}`, 5, y += dy);

        const p = canvasPoint(info.e);
        ctx.fillText(`p= ${p.x} ${p.y}`, 5, y += dy);

        let item = hitsItem(p.x, p.y);
        if (item != null) {
          ctx.fillText(`item ${item.x} ${item.y}`, 5, y += dy);
        }
      }

      ctx.fillText(drag.active ? 'drag' : '', 5, y += dy);

      ctx.lineWidth = 2;
      ctx.strokeStyle = "red";
      ctx.strokeRect(mixer.x, mixer.y, mixer.w, mixer.h);
      ctx.strokeStyle = "blue";
      ctx.strokeRect(nomixer.x, nomixer.y, nomixer.w, nomixer.h);
    }

    function loop() {
      draw();
      //drawInfo();
      requestAnimationFrame(loop);
    }

    loop();
  </script>
</body>

</html>
