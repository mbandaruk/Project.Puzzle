<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Экологическая головоломка</title>
  <style>
    * {
      margin: 0;
      padding: 0;
    }

    html,
    body {
      height: 100%;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    canvas {
      display: block;
      max-width: 100%;
      max-height: 100%;
      border: 1px solid lightgray;
      touch-action: none;
    }

    /* body {

<body>
  <!-- <canvas id="game" width="1920" height="1080"></canvas> -->
  <canvas id="game" width="3840" height="2160"></canvas>
  <!--  
  1080p (Full HD): 1920 x 1080
  4K 3840 × 2160   -->

  <script>

    // ---------- картинки ----------

    function loadImage(url) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        //img.crossOrigin = 'anonymous'; // если нужно
        img.onload = () => resolve(img);
        img.onerror = () => reject(new Error(`Не удалось загрузить: ${url}`));
        img.src = url;
      });
    }

    async function loadImages(sources) {
      return Promise.all(sources.map(url => loadImage(url)));
    }


    // ---------- холст, геометрия ----------

    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");

    function canvasPoint(e) {
      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;
      return {
        x: (e.clientX - rect.left) * scaleX,
        y: (e.clientY - rect.top) * scaleY
      };
    }

    function drawCenteredText(text, x, y, font, color = 'black') {
      ctx.font = font;
      ctx.fillStyle = color;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(text, x, y);
    }

    // Проверяет, пересекаются ли два прямоугольника
    function rectsIntersect(a, b) {
      return !(
        a.x + a.w < b.x ||   // a левее b
        a.x > b.x + b.w ||   // a правее b
        a.y + a.h < b.y ||   // a выше b
        a.y > b.y + b.h      // a ниже b
      );
    }

    const indent = canvas.height * 0.01; // отступ от края
    const side = (0.30 * canvas.height); // основание треугольника

    // место сборки (ловушки)
    const trapArea = {
      x: canvas.width / 2 - 1.5 * side,
      y: canvas.height / 2 - side + 0.15 * side,
      w: 3 * side, h: 2 * side
    };

    // место для разбросанных карточек
    const mixArea = {
      x: indent,
      y: indent,
      w: canvas.width - 2 * indent,
      h: canvas.height - 2 * indent
    };
    // запретное место для разброса
    const nomixArea = {
      x: trapArea.x,
      y: trapArea.y,
      w: trapArea.w,
      h: canvas.height
    };

    // ---------- картинки ----------
    const imageSources0 = [
      'img/0-0.jpg',
      'img/0-1.jpg',
      'img/0-2.jpg',
      'img/0-3.jpg',
      'img/0-4.jpg',
      'img/0-5.jpg',
    ];

    const imageSources1 = [
      'img/1-0.jpg',
      'img/1-1.jpg',
      'img/1-2.jpg',
      'img/1-3.jpg',
      'img/1-4.jpg',
      'img/1-5.jpg',
    ];

    let images0 = null;
    let images1 = null;


    // ---------- Item ----------

    class Item {
      x; y; w; h;
      scenario;
      num = 1;
      type = 't';
      image;
      trap = null;

      constructor(scenario, num, type) {
        this.scenario = scenario;
        this.num = num;
        this.type = type;

        if (this.scenario == 0) {
          this.image = images0[num];
        }
        else {
          this.image = images1[num];
        }

        if (this.type == 't') {
          this.w = side;
          this.h = side / 2;
        } else if (this.type == 'b') {
          this.w = side;
          this.h = side / 2;
        } else if (this.type == 'l') {
          this.w = side / 2;
          this.h = side;
        } else {
          this.w = side / 2;
          this.h = side;
        }
      }

      makePath() {
        ctx.beginPath();

        if (this.type == 't') {
          // верхний треугольник
          ctx.moveTo(this.x, this.y); // левая верхняя вершина
          ctx.lineTo(this.x + this.w / 2, this.y + this.h); // нижняя вершина
          ctx.lineTo(this.x + this.w, this.y); // правая верхняя вершина
        } else if (this.type == 'b') {
          // нижний треугольник
          ctx.moveTo(this.x + this.w / 2, this.y); // верхняя вершина
          ctx.lineTo(this.x + this.w, this.y + this.h); // правая нижняя вершина
          ctx.lineTo(this.x, this.y + this.h); // левая нижняя вершина
        } else if (this.type == 'l') {
          // левый треугольник
          ctx.moveTo(this.x, this.y); // левая верхняя вершина
          ctx.lineTo(this.x + this.w, this.y + this.h / 2); // правая вершина
          ctx.lineTo(this.x, this.y + this.h); // левая нижняя вершина
        } else {
          // правый треугольник
          ctx.moveTo(this.x, this.y + this.h / 2); // левая вершина
          ctx.lineTo(this.x + this.w, this.y); // верхняя правая вершина
          ctx.lineTo(this.x + this.w, this.y + this.h); // нижняя правая вершина
        }

        ctx.closePath();
        ctx.clip(); // применяем клип
      }

    }


    // ---------- Trap ----------

    class Trap {
      x; y; w; h;

      constructor(x, y) {
        this.x = x;
        this.y = y;
        this.w = side;
        this.h = side;
      }

      // точка привязки для типа Item
      hookForItemType(type) {
        if (type == 't' || type == 'l')
          return { x: this.x, y: this.y };
        else if (type == 'b')
          return { x: this.x, y: this.y + this.h / 2 };
        else
          return { x: this.x + this.w / 2, y: this.y };
      }
    }


    // ---------- maps ----------

    class Button {
      cx = 0; // center
      cy = 0; // center
      x = 0;
      y = 0;
      w = 600;
      h = 100;
      text = '';

      constructor(cx, cy, text) {
        this.cx = cx;
        this.cy = cy;
        this.x = cx - this.w / 2;
        this.y = cy - this.h / 2;
        this.text = text;
      }

      draw() {
        ctx.save(); // Сохраняем состояние
        this.makePath(); // обрезка по контуру

        // фон кнопки
        ctx.fillStyle = 'steelblue';
        ctx.fillRect(this.x, this.y, this.w, this.h);

        // текст кнопки
        drawCenteredText(this.text, this.cx, this.cy, "60px courier new", 'white');

        ctx.restore(); // Восстанавливаем состояние
      }

      makePath() {
        ctx.beginPath();
        ctx.rect(this.x, this.y, this.w, this.h);
        ctx.closePath();
        ctx.clip(); // применяем клип
      }
    }


    class TextMap {
      text = '';
      finished = 0;
      button = null;

      constructor(text, btnText = 'Далее') {
        this.text = text;
        let center = { x: canvas.width / 2, y: 0.85 * canvas.height };
        this.button = new Button(center.x, center.y, btnText);
        this.init();
      }

      hitsObject(x, y) {
        //for(let obj..) пока есть только одна кнопка
        let obj = this.button;
        {
          ctx.save(); //  Сохраняем состояние
          obj.makePath();
          const isInside = ctx.isPointInPath(x, y);
          ctx.restore(); // Восстанавливаем состояние
          if (isInside)
            return obj;
        }
        return null;
      }

      init() {
        this.finished = 0;
      }

      pointerdown(e) {
        const p = canvasPoint(e);
        var obj = this.hitsObject(p.x, p.y);
        if (obj == this.button)
          this.finished = 1;
      }

      pointermove(e) {
      }

      pointerup(e) {
      }

      pointercancel(e) {
      }

      draw() {
        let center = { x: canvas.width / 2, y: 0.4 * canvas.height };
        drawCenteredText(this.text, center.x, center.y, "80px courier new", 'steelblue');

        this.button.draw();
      }
    }

    class PuzzleMap {
      name = '?';
      finished = 0;
      items = null;
      button = null;
      scenario;

      constructor(name, scenario) {
        this.name = name;
        this.scenario = scenario;
        this.button = new Button(0.5 * canvas.width, 0.92 * canvas.height, 'Далее');
        this.buildItems();
        this.init();
      }

      init() {
        this.finished = 0;
        this.mixItems();
      }


      hitsItem(x, y) {
        // поиск попадания курсором. перебор массива в обратном порядке
        for (let i = this.items.length - 1; i >= 0; i--) {
          let item = this.items[i];

          ctx.save(); //  Сохраняем состояние
          item.makePath();
          const isInside = ctx.isPointInPath(x, y);
          ctx.restore(); // Восстанавливаем состояние
          if (isInside)
            return item;
        }
        return null;
      }

      clamp() {
        const item = this.drag.item;
        if (item == null)
          return;
        item.x = Math.max(0, Math.min(canvas.width - item.w, item.x));
        item.y = Math.max(0, Math.min(canvas.height - item.h, item.y));
      }


      calcTrap() {
        const item = this.drag.item;
        if (item == null)
          return;

        const distance = 0.1 * side;

        item.trap = null; // отвязка
        for (let trap of this.traps) {
          // точка привязки
          let point = trap.hookForItemType(item.type);

          if (Math.abs(point.x - item.x) < distance && Math.abs(point.y - item.y) < distance) {
            item.x = point.x;
            item.y = point.y;
            item.trap = trap; // привязка
            return;
          }
        }
      }

      analyze() {
        // для каждой ловушки
        for (let trap of this.traps) {

          // ищем все пойманные элементы
          let trappedItems = [];
          for (let item of this.items) {
            if (item.trap == trap) {
              trappedItems.push(item);
            }
          }

          if (trappedItems.length != 4) {
            // не поймано 4 элемента
            return;
          }
          else {
            // поймано 4 элемента
            console.log(`trapped ${trappedItems.length}`);

            var num = trappedItems[0].num;

            for (let item of trappedItems) {
              if (item.num != num) // в ловушке разные картинки
                return;
            }

            // все элементы в ловушке имеют одинаковый номер картинки
          }
        }

        // все ловушки имеют 4 элемента с одинаковыми картинками

        this.finished = 1;
        return;
      }

      buildItems() {
        this.items = [
          new Item(this.scenario, 0, 't'),
          new Item(this.scenario, 0, 'b'),
          new Item(this.scenario, 0, 'l'),
          new Item(this.scenario, 0, 'r'),

          new Item(this.scenario, 1, 't'),
          new Item(this.scenario, 1, 'b'),
          new Item(this.scenario, 1, 'l'),
          new Item(this.scenario, 1, 'r'),

          new Item(this.scenario, 2, 't'),
          new Item(this.scenario, 2, 'b'),
          new Item(this.scenario, 2, 'l'),
          new Item(this.scenario, 2, 'r'),

          new Item(this.scenario, 3, 't'),
          new Item(this.scenario, 3, 'b'),
          new Item(this.scenario, 3, 'l'),
          new Item(this.scenario, 3, 'r'),

          new Item(this.scenario, 4, 't'),
          new Item(this.scenario, 4, 'b'),
          new Item(this.scenario, 4, 'l'),
          new Item(this.scenario, 4, 'r'),

          new Item(this.scenario, 5, 't'),
          new Item(this.scenario, 5, 'b'),
          new Item(this.scenario, 5, 'l'),
          new Item(this.scenario, 5, 'r'),
        ];
      }

      // перемешать карточки на столе
      mixItems() {
        for (let item of this.items) {
          while (true) {
            item.x = mixArea.x + Math.random() * (mixArea.w - item.w);
            item.y = mixArea.y + Math.random() * (mixArea.h - item.h);

            item.trap = null;

            if (!rectsIntersect(item, nomixArea)) // не попал в запретную зону
              break;
          }
        }
      }

      traps = [
        new Trap(trapArea.x + 0 * side, trapArea.y),
        new Trap(trapArea.x + 1 * side, trapArea.y),
        new Trap(trapArea.x + 2 * side, trapArea.y),

        new Trap(trapArea.x + 0 * side, trapArea.y + side),
        new Trap(trapArea.x + 1 * side, trapArea.y + side),
        new Trap(trapArea.x + 2 * side, trapArea.y + side),
      ];


      drag = {
        active: false,
        item: null,
        offsetX: 0,
        offsetY: 0
      };



      pointerdown(e) {
        const p = canvasPoint(e);

        let item = this.hitsItem(p.x, p.y);
        if (item != null) {
          // перенос в конец массива (в ближний слой)
          const index = this.items.indexOf(item);
          if (index == -1)
            return;
          this.items.splice(index, 1);
          this.items.push(item);

          this.drag.active = true;
          this.drag.item = item;
          this.drag.offsetX = p.x - item.x;
          this.drag.offsetY = p.y - item.y;
          canvas.setPointerCapture(e.pointerId); // захват курсора
          canvas.style.cursor = "grabbing";
        }
      }

      pointermove(e) {
        const p = canvasPoint(e);

        if (this.drag.active) {
          this.drag.item.x = p.x - this.drag.offsetX;
          this.drag.item.y = p.y - this.drag.offsetY;
          this.clamp();
          this.calcTrap();
          this.analyze();
          return;
        }
        let item = this.hitsItem(p.x, p.y);
        canvas.style.cursor = item != null ? "grab" : "default";
      }

      endDrag(e) {
        this.drag.active = false;
        canvas.style.cursor = "default";
        canvas.releasePointerCapture(e.pointerId); // Отпускаем захват
      }

      pointerup(e) {
        this.endDrag(e);
      }

      pointercancel(e) {
        this.endDrag(e);
      }

      draw() {
        //рисуем ловушки (фон + пунктир)
        for (let trap of this.traps) {
          // ctx.fillStyle = "lightgray";
          // ctx.fillRect(trap.x, trap.y, trap.w, trap.h);

          ctx.setLineDash([10, 5]); // Задаём пунктир: 10px линия, 5px пробел
          ctx.strokeStyle = 'gray'; //'#000';
          ctx.lineWidth = 2;

          ctx.beginPath();
          ctx.moveTo(trap.x, trap.y);
          ctx.lineTo(trap.x + trap.w, trap.y + trap.w);
          ctx.stroke();

          ctx.beginPath();
          ctx.moveTo(trap.x + trap.w, trap.y);
          ctx.lineTo(trap.x, trap.y + trap.w);
          ctx.stroke();
        }

        ctx.beginPath();
        ctx.moveTo(trapArea.x + 1 * side, trapArea.y);
        ctx.lineTo(trapArea.x + 1 * side, trapArea.y + 2 * side);

        ctx.moveTo(trapArea.x + 2 * side, trapArea.y);
        ctx.lineTo(trapArea.x + 2 * side, trapArea.y + 2 * side);

        ctx.moveTo(trapArea.x, trapArea.y + side);
        ctx.lineTo(trapArea.x + 3 * side, trapArea.y + side);

        ctx.stroke();

        // рисуем фигуры. перебор массива в прямом порядке
        for (let item of this.items) {
          ctx.save(); // Сохраняем состояние

          item.makePath(); // обрезка по контуру
          if (item.type == 't') {
            // верхний треугольник
            ctx.drawImage(item.image,
              0, 0, 800, 400,
              item.x, item.y, item.w, item.h);
          } else if (item.type == 'b') {
            // нижний треугольник
            ctx.drawImage(item.image,
              0, 400, 800, 400,
              item.x, item.y, item.w, item.h);
          } else if (item.type == 'l') {
            // левый треугольник
            ctx.drawImage(item.image,
              0, 0, 400, 800,
              item.x, item.y, item.w, item.h);
          } else {
            // правый треугольник
            ctx.drawImage(item.image,
              400, 0, 400, 800,
              item.x, item.y, item.w, item.h);
          }

          ctx.restore(); // Восстанавливаем состояние
        }

        this.button.draw();
      }
    }

    // ---------- steps ----------

    class Steps {
      maps = [];
      current = 0;
      map = null;

      constructor() {
        // создаём карты в нужном порядке:

        this.maps.push(new TextMap('Экологическая игра'));

        {
          let m = new PuzzleMap('puzzle map (good)', 0);
          this.maps.push(m);
        }

        this.maps.push(new TextMap('Чистый светлый мир'));

        {
          let m = new PuzzleMap('puzzle map (bac)', 1);
          this.maps.push(m);
        }

        this.maps.push(new TextMap('Грязный унылый мир'));

        this.maps.push(new TextMap('Отличный результат!', 'Начать сначала'));

        this.map = this.maps[this.current];
      }

      next() {
        if (this.current >= this.maps.length - 1)
          this.current = 0;
        else
          this.current++;

        this.map = this.maps[this.current];
        this.map.init();
      }

    };

  </script>

  <script type="module">
    images0 = await loadImages(imageSources0);
    images1 = await loadImages(imageSources1);

    const info = {
      e: null,
    }

    const steps = new Steps();


    canvas.addEventListener("pointerdown", (e) => {
      steps.map.pointerdown(e);
    });

    canvas.addEventListener("pointermove", (e) => {
      info.e = e; // debug
      steps.map.pointermove(e);

    });

    canvas.addEventListener("pointerup", (e) => {
      steps.map.pointerup(e);
    });

    canvas.addEventListener("pointercancel", (e) => {
      steps.map.pointercancel(e);
    });

    canvas.addEventListener('dblclick', (e) => {
      // debug
      steps.map.finished = 1;
    })

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      steps.map.draw();
    }

    function drawInfo() {
      ctx.fillStyle = "black";
      ctx.font = "52px courier new bold";
      let y = 10;
      let dy = 60;

      // canvas:
      const rect = canvas.getBoundingClientRect();
      ctx.fillText(`canvas bounding rect= ${rect.x} ${rect.y} ${rect.width} ${rect.height}`, 5, y += dy);
      ctx.fillText(`canvas= ${canvas.x} ${canvas.y} ${canvas.width} ${canvas.height}`, 5, y += dy);

      // geometry:
      ctx.fillText(`indent= ${indent} side=${side}`, 5, y += dy);
      ctx.fillText(`trapArea= ${trapArea.x} w:${trapArea.w}`, 5, y += dy);
      ctx.fillText(`mixArea= ${mixArea.x} ${mixArea.y} ${mixArea.w} ${mixArea.h}`, 5, y += dy);

      // mouse:
      if (info.e != null) {
        ctx.fillText(`e.client= ${info.e.clientX} ${info.e.clientY}`, 5, y += dy);

        const p = canvasPoint(info.e);
        ctx.fillText(`p= ${p.x} ${p.y}`, 5, y += dy);

        //     let item = hitsItem(p.x, p.y);
        //     if (item != null) {
        //       ctx.fillText(`item ${item.x} ${item.y}`, 5, y += dy);
        //     }
      }

      //   ctx.fillText(drag.active ? 'drag' : '', 5, y += dy);

      ctx.lineWidth = 2;
      ctx.strokeStyle = "red";
      ctx.strokeRect(mixArea.x, mixArea.y, mixArea.w, mixArea.h);
      ctx.strokeStyle = "blue";
      ctx.strokeRect(nomixArea.x, nomixArea.y, nomixArea.w, nomixArea.h);

      ctx.fillText(`steps.current: ${steps.current}`, 5, y += dy);
      ctx.fillText(`steps.map.name: ${steps.map.name}`, 5, y += dy);
      ctx.fillText(`steps.map.finished: ${steps.map.finished}`, 5, y += dy);

    }

    function loop() {
      draw();
      // drawInfo(); // debug
      if (steps.map.finished)
        steps.next();
      requestAnimationFrame(loop);
    }

    loop();
  </script>
</body>
