<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Прямоугольник</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: white;
      color: #e8eaed;
      font-family: system-ui, sans-serif;
    }

    canvas {
      background: lightgray;
      border: 1px solid #343a46;
      touch-action: none;
      cursor: default;
    }

    p {
      margin: 12px 16px 0;
      font-size: 14px;
      opacity: 0.8;
      text-align: center;
    }
  </style>
</head>

<body>
  <canvas id="game" width="700" height="600"></canvas>

  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");

    function canvasPoint(e) {
      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;
      return {
        x: (e.clientX - rect.left) * scaleX,
        y: (e.clientY - rect.top) * scaleY
      };
    }


    class Box {
      x = 280;
      y = 170;
      w = 70;
      h = 70;
      color = "navy";

      constructor(x, y, color) {
        this.x = x;
        this.y = y;
        this.color = color;
      }
    }


  </script>


  <script>

    class PuzzleMap {
      name = '?';
      finished = 0;

      boxes = null;

      hitsBox(x, y) {
        for (let box of this.boxes) {
          if (x >= box.x && x <= box.x + box.w &&
            y >= box.y && y <= box.y + box.h) {
            return box;
          }
        }
        return null;
      }
      clamp() {
        const box = this.drag.box;
        if (box == null)
          return;
        box.x = Math.max(0, Math.min(canvas.width - box.w, box.x));
        box.y = Math.max(0, Math.min(canvas.height - box.h, box.y));
      }

      analyze() {
        for (let box of this.boxes) {
          if (box.x > 10)
            return;
        }
        this.finished = 1;
      }


      drag = {
        active: false,
        box: null,
        offsetX: 0,
        offsetY: 0
      };

      constructor(name) {
        this.name = name;
      }


      pointerdown(e) {
        const p = canvasPoint(e);
        let box = this.hitsBox(p.x, p.y);
        if (box == null) return;
        this.drag.active = true;
        this.drag.box = box;
        this.drag.offsetX = p.x - box.x;
        this.drag.offsetY = p.y - box.y;

        canvas.setPointerCapture(e.pointerId); // захват курсора
        canvas.style.cursor = "grabbing";
      }

      pointermove(e) {
        const p = canvasPoint(e);
        if (this.drag.active) {
          this.drag.box.x = p.x - this.drag.offsetX;
          this.drag.box.y = p.y - this.drag.offsetY;

          this.clamp();
          this.analyze();

          return;
        }

        let box = this.hitsBox(p.x, p.y);
        canvas.style.cursor = box != null ? "grab" : "default";
      }

      endDrag(e) {
        this.drag.active = false;
        canvas.style.cursor = "default";
        canvas.releasePointerCapture(e.pointerId); // Отпускаем захват
      }

      pointerup(e) {
        this.endDrag(e);
      }
      pointercancel(e) {
        this.endDrag(e);
      }

      draw() {
        for (let box of this.boxes) {
          ctx.fillStyle = box.color;
          ctx.fillRect(box.x, box.y, box.w, box.h);
        }
      }
    }

    const info = {
      e: null,
    }


    class csteps {
      maps = [];
      current = 0;

      map = null;

      constructor() {
        {
          let m = new PuzzleMap('map #0');
          m.boxes = [
            new Box(100, 300, "orange"),
            new Box(200, 300, "red"),
            new Box(300, 300, "green"),
          ];
          this.maps.push(m);
        }

        {
          let m = new PuzzleMap('map #1');
          m.boxes = [
            new Box(100, 300, "blue"),
            new Box(200, 300, "blue"),
            new Box(300, 300, "blue"),
          ];
          this.maps.push(m);
        }

        {
          let m = new PuzzleMap('map #2');
          m.boxes = [
            new Box(100, 200, "yellow"),
            new Box(200, 200, "red"),
            new Box(300, 200, "yellow"),
          ];
          this.maps.push(m);
        }

        this.map = this.maps[this.current];
      }

      next() {
        if (this.current >= this.maps.length-1)
          return;
        this.current++;
        this.map = this.maps[this.current];
      }

    };

    const steps = new csteps();




    canvas.addEventListener("pointerdown", (e) => {
      steps.map.pointerdown(e);
    });

    canvas.addEventListener("pointermove", (e) => {
      info.e = e; // debug
      steps.map.pointermove(e);
    });

    canvas.addEventListener("pointerup", (e) => {
      steps.map.pointerup(e);
    });

    canvas.addEventListener("pointercancel", (e) => {
      steps.map.pointercancel(e);
    });


    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      steps.map.draw();
    }

    function drawInfo() {
      ctx.fillStyle = "black";
      ctx.font = "12px courier new";
      let y = 10;
      let dy = 20

      // mouse:
      if (info.e != null) {
        ctx.fillText(`e.client= ${info.e.clientX} ${info.e.clientY}`, 5, y += dy);

        const p = canvasPoint(info.e);
        ctx.fillText(`p= ${p.x} ${p.y}`, 5, y += dy);

        // let item = hitsItem(p.x, p.y);
        // if (item != null) {
        //   ctx.fillText(`item ${item.x} ${item.y}`, 5, y += dy);
        // }
      }

      //   ctx.fillText(drag.active ? 'drag' : '', 5, y += 10);
      ctx.fillText(`steps.current: ${steps.current}`, 5, y += 10);
      ctx.fillText(`steps.map.name: ${steps.map.name}`, 5, y += 10);
      ctx.fillText(`steps.map.finished: ${steps.map.finished}`, 5, y += 10);
    }

    function loop() {
      draw();
      drawInfo();

      if (steps.map.finished)
        steps.next();

      requestAnimationFrame(loop);
    }

    loop();

  </script>
</body>

</html>
