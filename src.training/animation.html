<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Прямоугольник</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      /*display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center; */
      background: white;
      color: #e8eaed;
      font-family: system-ui, sans-serif;
    }

    canvas {
      border: 1px solid #343a46;
      touch-action: none;
      cursor: default;
    }

    p {
      margin: 12px 16px 0;
      font-size: 14px;
      opacity: 0.8;
      text-align: center;
    }
  </style>
</head>

<body>
  <canvas id="game" width="1200" height="800"></canvas>
  <!-- <p>Стрелки, WASD или перетаскивание мышью. На телефоне — кнопки или палец.</p> -->

  <script type="module">
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");

    function loadImage(url) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        //img.crossOrigin = 'anonymous'; // если нужно
        img.onload = () => resolve(img);
        img.onerror = () => reject(new Error(`Не удалось загрузить: ${url}`));
        img.src = url;
      });
    }

    async function loadImages(sources) {
      return Promise.all(sources.map(url => loadImage(url)));
    }

    const imageSources0 = [
      '0-0.jpg',
      '0-3.jpg'
    ];


    let images0 = await loadImages(imageSources0);



    class FlipMap {
      cx; cy;
      baseH; baseW;
      startTime = -1;
      speed = 1000; // pixel/sec

      //calculated
      x; y; w; h;

      constructor() {
        this.cx = 0.5 * canvas.width;
        this.cy = 0.5 * canvas.height;
        this.baseW = 400;
        this.baseH = 400;

        this.init();
      }

      init() {
        this.startTime = -1;
      }

      calc(time) //ms
      {
        if (this.startTime < 0)
          this.startTime = time; // самый первый шаг

        // считаем изменение
        const deltaTime = 0.001 * (time - this.startTime); //sec
        const calcH = this.baseH - this.speed * deltaTime;

        if (calcH < -this.baseH)
          return;

        // считаем координаты
        this.w = this.baseW;
        this.x = this.cx - 0.5 * this.w;
        this.h = calcH;
        this.y = this.cy - 0.5 * this.h;
      }

      draw() {
        ctx.fillStyle = 'gray';
        //ctx.fillRect(this.x, this.y, this.w, this.h);

        let image = images0[0];
        if (this.h < 0)
          image = images0[1];

        ctx.drawImage(image,
          0, 0, 800, 800,
          this.x, this.y, this.w, this.h);
      }
    }

    const controller = new FlipMap();

    function draw(time) {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      controller.calc(time);
      controller.draw();
    }

    function drawDebug(time) {
      let y = 20;
      let dy = 20;
      ctx.font = "12px courier new";

      ctx.fillText(`time= ${time}`, 5, y += dy);
      ctx.fillText(`startTime= ${controller.startTime}`, 5, y += dy);
      ctx.fillText(`controller= ${controller.x} ${controller.y} ${controller.w} ${controller.h}`, 5, y += dy);
    }

    function loop(time) {
      draw(time);
      drawDebug(time);
      requestAnimationFrame(loop);
    }

    requestAnimationFrame(loop);
  </script>
</body>

</html>
