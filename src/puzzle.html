<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Прямоугольник</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: white;
      color: #e8eaed;
      font-family: system-ui, sans-serif;
    }

    canvas {
      background: lightgray;
      border: 1px solid #343a46;
      touch-action: none;
      cursor: default;
    }

    p {
      margin: 12px 16px 0;
      font-size: 14px;
      opacity: 0.8;
      text-align: center;
    }
  </style>
</head>

<body>
  <canvas id="game" width="700" height="600"></canvas>

  <script>
    function loadImage(url) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        //img.crossOrigin = 'anonymous'; // если нужно
        img.onload = () => resolve(img);
        img.onerror = () => reject(new Error(`Не удалось загрузить: ${url}`));
        img.src = url;
      });
    }

    async function loadImages(sources) {
      const entries = Object.entries(sources);
      const loaded = await Promise.all(
        entries.map(([key, url]) =>
          loadImage(url).then(img => [key, img])
        )
      );
      return Object.fromEntries(loaded); // { bg: Image, character: Image, ... }
    }

  </script>

  <script type="module">
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");

    class Item {
      x = 0;
      y = 0;
      w = 100;
      h;
      type = 't';

      MakePath() {
        ctx.beginPath();
        ctx.moveTo(this.x, this.y);    // верхняя вершина
        ctx.lineTo(this.x + this.w / 2, this.y + this.h);    // левая нижняя
        ctx.lineTo(this.x + this.w, this.y);   // правая нижняя
        ctx.closePath();
        ctx.clip(); // применяем клип
      }

      constructor(x, y, type) {
        this.x = x;
        this.y = y;
        this.h = this.w / 2;
        this.type = type;
      }
    }

    // треугольники (фигуры)
    const items = [
      new Item(100, 100, 't'),
      new Item(200, 200, 'b'),
      new Item(300, 200, 'l'),
      new Item(400, 200, 'r'),
      //new Item(500, 200),
    ];


    // графика
    const imageSources = {
      ok1: 'img/ok1.jpg',
      ok2: 'img/ok2.jpg',
    };
    const images = await loadImages(imageSources);












    const info = {
      e: null,
    }

    const drag = {
      active: false,
      item: null,
      offsetX: 0,
      offsetY: 0
    };


    function canvasPoint(e) {
      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;
      return {
        x: (e.clientX - rect.left) * scaleX,
        y: (e.clientY - rect.top) * scaleY
      };
    }


    function hitsItem(x, y) {
      for (let item of items) {
        ctx.save(); //  Сохраняем состояние
        item.MakePath();
        const isInside = ctx.isPointInPath(x, y);
        ctx.restore(); // Восстанавливаем состояние
        if (isInside)
          return item;
      }
      return null;
    }


    function clamp() {
      const item = drag.item;
      if (item == null)
        return;
      item.x = Math.max(0, Math.min(canvas.width - item.w, item.x));
      item.y = Math.max(0, Math.min(canvas.height - item.h, item.y));
    }

    canvas.addEventListener("pointerdown", (e) => {
      const p = canvasPoint(e);

      let item = hitsItem(p.x, p.y);
      if (item != null) {
        drag.active = true;
        drag.item = item;
        drag.offsetX = p.x - item.x;
        drag.offsetY = p.y - item.y;
        canvas.setPointerCapture(e.pointerId); // захват курсора
        canvas.style.cursor = "grabbing";
      }
    });

    canvas.addEventListener("pointermove", (e) => {
      info.e = e; // debug

      const p = canvasPoint(e);

      if (drag.active) {
        drag.item.x = p.x - drag.offsetX;
        drag.item.y = p.y - drag.offsetY;
        clamp();
        return;
      }
      let item = hitsItem(p.x, p.y);
      canvas.style.cursor = item != null ? "grab" : "default";
    });

    function endDrag(e) {
      drag.active = false;
      canvas.style.cursor = "default";

      // Отпускаем захват ?
      canvas.releasePointerCapture(e.pointerId);
    }

    canvas.addEventListener("pointerup", (e) => {
      // console.log("pointerup");
      endDrag(e);
    });

    canvas.addEventListener("pointercancel", (e) => {
      // console.log("pointercancel");
      endDrag(e);
    });

    // canvas.addEventListener("pointerleave", (e) => {
    //   // console.log("pointerleave");
    // });

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      for (let item of items) {
        ctx.save(); //  Сохраняем состояние
        item.MakePath();

        ctx.fillStyle = "blue"; // kill
        ctx.fillRect(item.x, item.y, 10000, 10000); // kill

        ctx.drawImage(images.ok1,
          0, 0, 800, 800,
          item.x, item.y, item.w, item.h * 2);
        ctx.restore(); // 4. Восстанавливаем состояние
      }
    }

    function drawInfo() {
      ctx.fillStyle = "black";
      ctx.font = "12px courier new";

      let y = 10;

      // canvas:
      const rect = canvas.getBoundingClientRect();
      ctx.fillText(`canvas bounding rect= ${rect.x} ${rect.y} ${rect.width} ${rect.height}`, 5, y += 10);

      ctx.fillText(`canvas= ${canvas.x} ${canvas.y} ${canvas.width} ${canvas.height}`, 5, y += 10);

      // mouse:
      if (info.e != null) {
        ctx.fillText(`e.client= ${info.e.clientX} ${info.e.clientY}`, 5, y += 10);

        const p = canvasPoint(info.e);
        ctx.fillText(`p= ${p.x} ${p.y}`, 5, y += 10);

        let item = hitsItem(p.x, p.y);
        if (item != null) {
          ctx.fillText(`item ${item.x} ${item.y}`, 5, y += 10);
        }
      }

      ctx.fillText(drag.active ? 'drag' : '', 5, y += 10);
    }

    function loop() {
      draw();
      drawInfo();
      requestAnimationFrame(loop);
    }

    loop();
  </script>
</body>

</html>
