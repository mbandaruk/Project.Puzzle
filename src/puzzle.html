<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Прямоугольник</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: white;
      color: #e8eaed;
      font-family: system-ui, sans-serif;
    }

    canvas {
      background: lightgray;
      border: 1px solid #343a46;
      touch-action: none;
      cursor: default;
    }

    p {
      margin: 12px 16px 0;
      font-size: 14px;
      opacity: 0.8;
      text-align: center;
    }
  </style>
</head>

<body>
  <canvas id="game" width="1200" height="800"></canvas>

  <script>
    function loadImage(url) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        //img.crossOrigin = 'anonymous'; // если нужно
        img.onload = () => resolve(img);
        img.onerror = () => reject(new Error(`Не удалось загрузить: ${url}`));
        img.src = url;
      });
    }

    async function loadImages(sources) {
      const entries = Object.entries(sources);
      const loaded = await Promise.all(
        entries.map(([key, url]) =>
          loadImage(url).then(img => [key, img])
        )
      );
      return Object.fromEntries(loaded); // { bg: Image, character: Image, ... }
    }

  </script>

  <script type="module">
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");

    const side = 240;

    class Item {
      x = 0;
      y = 0;
      w;
      h;
      type = 't';

      MakePath() {
        ctx.beginPath();

        if (this.type == 't') {
          // верхний треугольник
          ctx.moveTo(this.x, this.y); // левая верхняя вершина
          ctx.lineTo(this.x + this.w / 2, this.y + this.h); // нижняя вершина
          ctx.lineTo(this.x + this.w, this.y); // правая верхняя вершина
        } else if (this.type == 'b') {
          // нижний треугольник
          ctx.moveTo(this.x + this.w / 2, this.y); // верхняя вершина
          ctx.lineTo(this.x + this.w, this.y + this.h); // правая нижняя вершина
          ctx.lineTo(this.x, this.y + this.h); // левая нижняя вершина
        } else if (this.type == 'l') {
          // левый треугольник
          ctx.moveTo(this.x, this.y); // левая верхняя вершина
          ctx.lineTo(this.x + this.w, this.y + this.h / 2); // правая вершина
          ctx.lineTo(this.x, this.y + this.h); // левая нижняя вершина
        } else {
          // правый треугольник
          ctx.moveTo(this.x, this.y + this.h / 2); // левая вершина
          ctx.lineTo(this.x + this.w, this.y); // верхняя правая вершина
          ctx.lineTo(this.x + this.w, this.y + this.h); // нижняя правая вершина
        }

        ctx.closePath();
        ctx.clip(); // применяем клип
      }

      constructor(x, y, type) {
        this.x = x;
        this.y = y;
        this.type = type;
        if (this.type == 't') {
          this.w = side;
          this.h = side / 2;
        } else if (this.type == 'b') {
          this.w = side;
          this.h = side / 2;
        } else if (this.type == 'l') {
          this.w = side / 2;
          this.h = side;
        } else {
          this.w = side / 2;
          this.h = side;
        }
      }
    }

    // треугольники (фигуры)
    const items = [
      new Item(600, 200, 't'),
      new Item(700, 200, 'b'),
      new Item(800, 200, 'l'),
      new Item(900, 200, 'r'),
      //new Item(500, 200),
    ];


    // графика
    const imageSources = {
      ok1: 'img/ok1.jpg',
      ok2: 'img/ok2.jpg',
    };
    const images = await loadImages(imageSources);


    class Trap {
      x; y; w; h;

      constructor(x, y) {
        this.x = x;
        this.y = y;
        this.w = side;
        this.h = side;
      }
    }

    const trapsLocation = { x: 50, y: 50 }
    const traps = [
      new Trap(trapsLocation.x, trapsLocation.y),
      new Trap(trapsLocation.x + side, trapsLocation.y),

      new Trap(trapsLocation.x, trapsLocation.y + side),
      new Trap(trapsLocation.x + side, trapsLocation.y + side),

      new Trap(trapsLocation.x, trapsLocation.y + side * 2),
      new Trap(trapsLocation.x + side, trapsLocation.y + side * 2)
    ];


    const info = {
      e: null,
    }

    const drag = {
      active: false,
      item: null,
      offsetX: 0,
      offsetY: 0
    };


    function canvasPoint(e) {
      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;
      return {
        x: (e.clientX - rect.left) * scaleX,
        y: (e.clientY - rect.top) * scaleY
      };
    }


    function hitsItem(x, y) {
      for (let item of items) {
        ctx.save(); //  Сохраняем состояние
        item.MakePath();
        const isInside = ctx.isPointInPath(x, y);
        ctx.restore(); // Восстанавливаем состояние
        if (isInside)
          return item;
      }
      return null;
    }


    function clamp() {
      const item = drag.item;
      if (item == null)
        return;
      item.x = Math.max(0, Math.min(canvas.width - item.w, item.x));
      item.y = Math.max(0, Math.min(canvas.height - item.h, item.y));
    }

    function calcTrap() {
      const item = drag.item;
      if (item == null)
        return;

      const distance = 0.1 * side;

      for (let trap of traps) {
        // точка привязки
        let point = { x: 0, y: 0 };

        if (item.type == 't' || item.type == 'l') {
          point = { x: trap.x, y: trap.y };
        }
        else if (item.type == 'b') {
          point = { x: trap.x, y: trap.y + trap.h / 2 };
        }
        else {
          point = { x: trap.x + trap.w / 2, y: trap.y };
        }

        if (Math.abs(point.x - item.x) < distance && Math.abs(point.y - item.y) < distance) {
          item.x = point.x;
          item.y = point.y;
          return;
        }
      }
    }

    canvas.addEventListener("pointerdown", (e) => {
      const p = canvasPoint(e);

      let item = hitsItem(p.x, p.y);
      if (item != null) {
        drag.active = true;
        drag.item = item;
        drag.offsetX = p.x - item.x;
        drag.offsetY = p.y - item.y;
        canvas.setPointerCapture(e.pointerId); // захват курсора
        canvas.style.cursor = "grabbing";
      }
    });

    canvas.addEventListener("pointermove", (e) => {
      info.e = e; // debug

      const p = canvasPoint(e);

      if (drag.active) {
        drag.item.x = p.x - drag.offsetX;
        drag.item.y = p.y - drag.offsetY;
        clamp();
        calcTrap();
        return;
      }
      let item = hitsItem(p.x, p.y);
      canvas.style.cursor = item != null ? "grab" : "default";
    });

    function endDrag(e) {
      drag.active = false;
      canvas.style.cursor = "default";

      // Отпускаем захват ?
      canvas.releasePointerCapture(e.pointerId);
    }

    canvas.addEventListener("pointerup", (e) => {
      // console.log("pointerup");
      endDrag(e);
    });

    canvas.addEventListener("pointercancel", (e) => {
      // console.log("pointercancel");
      endDrag(e);
    });

    // canvas.addEventListener("pointerleave", (e) => {
    //   // console.log("pointerleave");
    // });

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      //... ловушки
      for (let trap of traps) {
        ctx.fillStyle = "gray";
        ctx.fillRect(trap.x, trap.y, trap.w, trap.h);

        ctx.setLineDash([10, 5]); // Задаём пунктир: 10px линия, 5px пробел

        ctx.beginPath();
        ctx.moveTo(trap.x, trap.y);
        ctx.lineTo(trap.x + trap.w, trap.y + trap.w);
        ctx.strokeStyle = '#000';
        ctx.lineWidth = 2;
        ctx.stroke()

        ctx.beginPath();
        ctx.moveTo(trap.x + trap.w, trap.y);
        ctx.lineTo(trap.x, trap.y + trap.w);
        ctx.strokeStyle = '#000';
        ctx.lineWidth = 2;
        ctx.stroke()
      }

      for (let item of items) {
        ctx.save(); //  Сохраняем состояние
        item.MakePath();

        ctx.fillStyle = "blue"; // kill
        ctx.fillRect(item.x, item.y, 10000, 10000); // kill


        if (item.type == 't') {
          // верхний треугольник
          ctx.drawImage(images.ok1,
            0, 0, 800, 400,
            item.x, item.y, item.w, item.h);

        } else if (item.type == 'b') {
          // нижний треугольник
          ctx.drawImage(images.ok1,
            0, 400, 800, 400,
            item.x, item.y, item.w, item.h);

        } else if (item.type == 'l') {
          // левый треугольник
          ctx.drawImage(images.ok1,
            0, 0, 400, 800,
            item.x, item.y, item.w, item.h);

        } else {
          // правый треугольник
          ctx.drawImage(images.ok1,
            400, 0, 400, 800,
            item.x, item.y, item.w, item.h);

        }

        ctx.restore(); // 4. Восстанавливаем состояние
      }


    }

    function drawInfo() {
      ctx.fillStyle = "black";
      ctx.font = "12px courier new";

      let y = 10;

      // canvas:
      const rect = canvas.getBoundingClientRect();
      ctx.fillText(`canvas bounding rect= ${rect.x} ${rect.y} ${rect.width} ${rect.height}`, 5, y += 10);

      ctx.fillText(`canvas= ${canvas.x} ${canvas.y} ${canvas.width} ${canvas.height}`, 5, y += 10);

      // mouse:
      if (info.e != null) {
        ctx.fillText(`e.client= ${info.e.clientX} ${info.e.clientY}`, 5, y += 10);

        const p = canvasPoint(info.e);
        ctx.fillText(`p= ${p.x} ${p.y}`, 5, y += 10);

        let item = hitsItem(p.x, p.y);
        if (item != null) {
          ctx.fillText(`item ${item.x} ${item.y}`, 5, y += 10);
        }
      }

      ctx.fillText(drag.active ? 'drag' : '', 5, y += 10);
    }

    function loop() {
      draw();
      // drawInfo();
      requestAnimationFrame(loop);
    }

    loop();
  </script>
</body>

</html>
