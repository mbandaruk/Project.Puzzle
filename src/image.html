<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Game</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: white;
      color: #e8eaed;
      font-family: system-ui, sans-serif;
    }

    canvas {
      background: lightgray;
      border: 1px solid #343a46;
      touch-action: none;
      cursor: default;
    }

    p {
      margin: 12px 16px 0;
      font-size: 14px;
      opacity: 0.8;
      text-align: center;
    }
  </style>
</head>

<body>
  <canvas id="game" width="1000" height="1000"></canvas>

  <script type="module">
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");



    function loadImage(url) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        //img.crossOrigin = 'anonymous'; // если нужно
        img.onload = () => resolve(img);
        img.onerror = () => reject(new Error(`Не удалось загрузить: ${url}`));
        img.src = url;
      });
    }

    async function loadImages(sources) {
      const entries = Object.entries(sources);
      const loaded = await Promise.all(
        entries.map(([key, url]) =>
          loadImage(url).then(img => [key, img])
        )
      );
      return Object.fromEntries(loaded); // { bg: Image, character: Image, ... }
    }



    // Использование
    const imageSources = {
      ok1: 'img/ok1.jpg',
      ok2: 'img/ok2.jpg',
    };



    const images = await loadImages(imageSources);



    // ************************************************************************

    // 1. Сохраняем состояние
    ctx.save();

    // 2. Создаём треугольный клип
    ctx.beginPath();
    ctx.moveTo(0, 0);    // верхняя вершина
    ctx.lineTo(400, 400);    // левая нижняя
    ctx.lineTo(800, 0);   // правая нижняя
    ctx.closePath();
    ctx.clip();             // применяем клип

    ctx.drawImage(images.ok1, 0, 0);





    // 4. Восстанавливаем состояние
    ctx.restore();


    // ************************************************************************
    ctx.save();
    //2
    ctx.beginPath();
    ctx.moveTo(0, 800);    // верхняя вершина
    ctx.lineTo(400, 400);    // левая нижняя
    ctx.lineTo(800, 800);   // правая нижняя
    ctx.closePath();
    ctx.clip();             // применяем клип
    ctx.drawImage(images.ok1, 0, 0);

    ctx.restore();




    // ctx.drawImage(images.ok1, 
    //   0, 0, 400, 400,
    //   0,0,200,200);

    // ctx.drawImage(images.ok1,
    //   400, 400, 400, 400,
    //   200,200,200,200);

    // ctx.drawImage(images.ok2,
    //   400, 400, 400, 400,
    //   300,300,200,200);


  </script>
</body>

</html>
